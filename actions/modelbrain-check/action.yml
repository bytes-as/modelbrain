name: ModelBrain check
description: Scan a repo for Hugging Face model loads and ask ModelBrain for a verdict.
inputs:
  api_url:
    description: ModelBrain API base URL
    required: true
  hq_country:
    description: ISO-2 headquarters country
    required: true
    default: DE
  commercial:
    description: Whether the product is commercial
    required: false
    default: "true"
  markets:
    description: Comma-separated ISO-2 markets
    required: false
    default: ""
  strict:
    description: Fail on CANNOT_DETERMINE as well as BLOCKED
    required: false
    default: "false"
  fail_on_unreachable:
    description: Fail the build when the ModelBrain API cannot be reached
    required: false
    default: "false"
  path:
    description: Directory to scan for model ids
    required: false
    default: "."
runs:
  using: composite
  steps:
    - name: ModelBrain check
      shell: bash
      env:
        MODELBRAIN_API_URL: ${{ inputs.api_url }}
        MODELBRAIN_HQ: ${{ inputs.hq_country }}
        MODELBRAIN_MARKETS: ${{ inputs.markets }}
        MODELBRAIN_COMMERCIAL: ${{ inputs.commercial }}
        MODELBRAIN_STRICT: ${{ inputs.strict }}
        FAIL_ON_UNREACHABLE: ${{ inputs.fail_on_unreachable }}
        MODELBRAIN_PATH: ${{ inputs.path }}
      run: python3 "${{ github.action_path }}/check.py"
