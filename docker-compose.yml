# Local stack: FalkorDB + API. Run the web app with `npm run dev -- -p 3001` in apps/web (port 3000 is the FalkorDB Browser).
services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"   # Redis protocol (falkordb-py)
      - "3000:3000"   # FalkorDB Browser UI
    environment:
      - REDIS_ARGS=--appendonly yes   # verified: Redis options go in REDIS_ARGS (add --requirepass in production)
      - FALKORDB_ARGS=MAX_QUEUED_QUERIES 25 TIMEOUT 5000 RESULTSET_SIZE 10000   # image default TIMEOUT is 1000 ms
    volumes:
      - falkordb-data:/var/lib/falkordb/data   # verified data path
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./services/api
    env_file: .env
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
    ports:
      - "8000:8000"
    depends_on:
      falkordb:
        condition: service_healthy

volumes:
  falkordb-data:
